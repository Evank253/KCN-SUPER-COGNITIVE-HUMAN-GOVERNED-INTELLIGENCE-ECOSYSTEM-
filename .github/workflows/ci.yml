name: CI

on:
  push:
    branches: [main, develop, "copilot/delete-copilot-change-default-branch-to-main"]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Repository bootstrap: create main branch and set default
  # Runs only on the cleanup/setup branch, not on main or develop.
  # ──────────────────────────────────────────────
  bootstrap-main-branch:
    name: Bootstrap main branch
    if: github.ref == 'refs/heads/copilot/delete-copilot-change-default-branch-to-main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create main branch from Phase 1 merge commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PHASE1_SHA: e311535ff96d5011ee2aa6352d20bc69bededbbb
        run: |
          set -euo pipefail

          existing=$(gh api "repos/${REPO}/branches/main" --silent 2>&1 || true)
          if echo "$existing" | grep -q '"name"'; then
            echo "Branch 'main' already exists — skipping creation"
          else
            echo "Creating branch 'main' at ${PHASE1_SHA}"
            gh api "repos/${REPO}/git/refs" \
              --method POST \
              --field "ref=refs/heads/main" \
              --field "sha=${PHASE1_SHA}"
            echo "✅ main branch created"
          fi

      - name: Update develop to Phase 1 merge commit (if behind)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PHASE1_SHA: e311535ff96d5011ee2aa6352d20bc69bededbbb
        run: |
          set -euo pipefail

          existing=$(gh api "repos/${REPO}/branches/develop" --silent 2>&1 || true)
          if echo "$existing" | grep -q '"name"'; then
            current_sha=$(echo "$existing" | python3 -c "import sys,json; print(json.load(sys.stdin)['commit']['sha'])" 2>/dev/null || echo "unknown")
            if [ "$current_sha" = "$PHASE1_SHA" ]; then
              echo "develop is already at Phase 1 commit — no update needed"
            else
              echo "Updating develop to ${PHASE1_SHA} (was ${current_sha})"
              gh api "repos/${REPO}/git/refs/heads/develop" \
                --method PATCH \
                --field "sha=${PHASE1_SHA}" \
                --field "force=true"
              echo "✅ develop updated"
            fi
          else
            echo "Creating branch 'develop' at ${PHASE1_SHA}"
            gh api "repos/${REPO}/git/refs" \
              --method POST \
              --field "ref=refs/heads/develop" \
              --field "sha=${PHASE1_SHA}"
            echo "✅ develop branch created"
          fi

      - name: Set main as default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}" \
            --method PATCH \
            --field "default_branch=main"
          echo "✅ Default branch set to main"

      - name: Delete copilot/change-default-branch-to-main cleanup branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          response=$(gh api "repos/${REPO}/git/refs/heads/copilot/change-default-branch-to-main" --silent 2>&1 || true)
          if echo "$response" | grep -q '"ref"'; then
            gh api "repos/${REPO}/git/refs/heads/copilot/change-default-branch-to-main" --method DELETE
            echo "✅ Deleted copilot/change-default-branch-to-main"
          else
            echo "Branch not found — skipping"
          fi

      - name: Delete copilot/kcn-super-cognitive-ecosystem cleanup branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          response=$(gh api "repos/${REPO}/git/refs/heads/copilot/kcn-super-cognitive-ecosystem" --silent 2>&1 || true)
          if echo "$response" | grep -q '"ref"'; then
            gh api "repos/${REPO}/git/refs/heads/copilot/kcn-super-cognitive-ecosystem" --method DELETE
            echo "✅ Deleted copilot/kcn-super-cognitive-ecosystem"
          else
            echo "Branch not found — skipping"
          fi

      - name: Set branch protection — main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD='{"required_status_checks":{"strict":true,"contexts":["Backend (Python 3.12)","Frontend (Node.js 20)","Docker build verification"]},"enforce_admins":false,"required_pull_request_reviews":{"dismiss_stale_reviews":true,"require_code_owner_reviews":false,"required_approving_review_count":1},"restrictions":null}'
          gh api "repos/${REPO}/branches/main/protection" \
            --method PUT \
            --header "Accept: application/vnd.github+json" \
            --input <(echo "$PAYLOAD") && echo "✅ Branch protection set on main" || echo "⚠️ Could not set protection on main (may need admin token)"

      - name: Set branch protection — develop
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD='{"required_status_checks":{"strict":true,"contexts":["Backend (Python 3.12)","Frontend (Node.js 20)","Docker build verification"]},"enforce_admins":false,"required_pull_request_reviews":{"dismiss_stale_reviews":true,"require_code_owner_reviews":false,"required_approving_review_count":1},"restrictions":null}'
          gh api "repos/${REPO}/branches/develop/protection" \
            --method PUT \
            --header "Accept: application/vnd.github+json" \
            --input <(echo "$PAYLOAD") && echo "✅ Branch protection set on develop" || echo "⚠️ Could not set protection on develop (may need admin token)"


  # ──────────────────────────────────────────────
  # Backend: lint, type-check, and test
  # ──────────────────────────────────────────────
  test-backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff mypy

      - name: Lint (Ruff)
        run: |
          cd backend
          ruff check app/

      - name: Run tests (Pytest)
        run: |
          cd backend
          pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # Frontend: lint and test
  # ──────────────────────────────────────────────
  test-frontend:
    name: Frontend (Node.js 20)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Build
        run: |
          cd frontend
          npm run build

  # ──────────────────────────────────────────────
  # Docker: verify images build successfully
  # ──────────────────────────────────────────────
  build-docker:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: kcn-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: kcn-frontend:ci
