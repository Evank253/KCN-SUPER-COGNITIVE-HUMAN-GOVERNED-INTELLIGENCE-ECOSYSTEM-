name: CI

on:
  push:
    branches: [main, develop, "copilot/kcn-super-cognitive-ecosystem"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff mypy

      - name: Lint (Ruff)
        run: |
          cd backend
          ruff check app/

      - name: Run tests (Pytest)
        run: |
          cd backend
          pytest tests/ -v --tb=short

  test-frontend:
    name: Frontend (Node.js 22)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Build
        run: |
          cd frontend
          npm run build

  build-docker:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: kcn-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: kcn-frontend:ci
