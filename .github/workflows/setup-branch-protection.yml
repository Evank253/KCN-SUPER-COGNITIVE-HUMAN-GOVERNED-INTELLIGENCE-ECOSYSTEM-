name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print rules without applying)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  administration: write
  contents: read

jobs:
  protect-branches:
    name: Apply branch protection rules
    runs-on: ubuntu-latest
    steps:
      - name: Protect main branch
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              required_status_checks: {
                strict: true,
                contexts: [
                  'Backend (Python 3.12)',
                  'Frontend (Node.js 20)',
                  'Docker build verification'
                ]
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                required_approving_review_count: 1
              },
              restrictions: null
            });
            console.log('✅ Branch protection applied to: main');

      - name: Protect develop branch
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'develop',
              required_status_checks: {
                strict: true,
                contexts: [
                  'Backend (Python 3.12)',
                  'Frontend (Node.js 20)',
                  'Docker build verification'
                ]
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                required_approving_review_count: 1
              },
              restrictions: null
            });
            console.log('✅ Branch protection applied to: develop');

      - name: Dry run - show rules that would be applied
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN: Rules that would be applied ==="
          echo ""
          echo "Branch: main"
          echo "  required_status_checks:"
          echo "    strict: true (branch must be up to date)"
          echo "    contexts:"
          echo "      - Backend (Python 3.12)"
          echo "      - Frontend (Node.js 20)"
          echo "      - Docker build verification"
          echo "  enforce_admins: true"
          echo "  required_pull_request_reviews:"
          echo "    dismiss_stale_reviews: true"
          echo "    required_approving_review_count: 1"
          echo ""
          echo "Branch: develop"
          echo "  (same rules as main)"

      - name: Verify protection was applied
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            for (const branch of ['main', 'develop']) {
              try {
                const { data } = await github.rest.repos.getBranchProtection({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch
                });
                const reviews = data.required_pull_request_reviews;
                const checks = data.required_status_checks;
                console.log(`✅ ${branch}:`);
                console.log(`   enforce_admins: ${data.enforce_admins.enabled}`);
                console.log(`   required_approving_review_count: ${reviews?.required_approving_review_count}`);
                console.log(`   dismiss_stale_reviews: ${reviews?.dismiss_stale_reviews}`);
                console.log(`   strict status checks: ${checks?.strict}`);
                console.log(`   required contexts: ${JSON.stringify(checks?.contexts)}`);
              } catch (e) {
                console.error(`❌ Could not verify ${branch}: ${e.message}`);
              }
            }
