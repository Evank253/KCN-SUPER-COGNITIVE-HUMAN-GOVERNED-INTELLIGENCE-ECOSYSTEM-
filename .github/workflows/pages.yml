name: Deploy public demo to GitHub Pages

on:
  push:
    branches: ["copilot/kcn-super-cognitive-ecosystem", main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-exists: ${{ steps.check.outputs.exists }}
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check for frontend directory
        id: check-frontend
        run: |
          if [ -d frontend ]; then
            echo "path=frontend" >> $GITHUB_OUTPUT
          elif [ -f package.json ] && grep -q '"build"' package.json; then
            echo "path=." >> $GITHUB_OUTPUT
          else
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: Install and build frontend
        if: steps.check-frontend.outputs.path != ''
        run: |
          cd ${{ steps.check-frontend.outputs.path }}
          npm ci --legacy-peer-deps 2>/dev/null || npm install 2>/dev/null || true
          npm run build 2>/dev/null || true

      - name: Copy build output
        id: check
        run: |
          if [ -d "frontend/dist" ]; then
            mkdir -p public-demo
            cp -r frontend/dist/* public-demo/ 2>/dev/null || true
            echo "exists=true" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then
            mkdir -p public-demo
            cp -r dist/* public-demo/ 2>/dev/null || true
            echo "exists=true" >> $GITHUB_OUTPUT
          elif [ -d "build" ]; then
            mkdir -p public-demo
            cp -r build/* public-demo/ 2>/dev/null || true
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            # Create minimal fallback demo
            mkdir -p public-demo
            echo "<html><body><h1>KCN Demo</h1><p>Build in progress...</p></body></html>" > public-demo/index.html
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-demo
        continue-on-error: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    continue-on-error: true

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
