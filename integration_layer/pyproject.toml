[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kcn-integration-layer"
version = "0.11.0"
description = "KCN Singularity Master – Phase 11 Integration Layer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "KCN Architecture Team"}]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_control_plane*", "data_fabric*", "event_orchestration*", "identity_federation*", "service_mesh*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
